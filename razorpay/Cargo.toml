[package]
name = "razorpay"
version = "0.1.0"
edition = "2024"
description = "Async, type-safe Rust SDK for the Razorpay API"
license = "MIT OR Apache-2.0"

[dependencies]
async-trait = "0.1"
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12", features = ["json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = { version = "2", features = ["serde"] }

[dev-dependencies]
wiremock = "0.6"
