[package]
name = "razorpay-tests"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
dotenvy = "0.15"
hex = "0.4"
hmac = "0.12"
razorpay = { path = "../razorpay" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2"
wiremock = "0.6"
