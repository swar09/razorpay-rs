[package]
name = "razorpay-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
dotenvy = "0.15"
hex = "0.4"
hmac = "0.12"
razorpay = { package = "razorpay-rs", path = "../razorpay" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2"
wiremock = "0.6"
