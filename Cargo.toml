[workspace]
resolver = "2"
members = [
    "razorpay",
    "examples",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/swar09/razorpay-rs"
homepage = "https://github.com/swar09/razorpay-rs"
documentation = "https://docs.rs/razorpay-rs"
readme = "README.md"
keywords = ["razorpay", "payments", "sdk", "fintech", "api"]
categories = ["api-bindings", "asynchronous", "web-programming::http-client"]
