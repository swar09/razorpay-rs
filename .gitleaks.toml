title = "Gitleaks Configuration for razorpay-rs"

[extend]
useDefault = true

[allowlist]
description = "Allow dummy test keys and mock fixtures"
regexes = [
    '''rzp_test_key''',
    '''test_secret''',
    '''fake_.*''',
    '''dummy.*''',
]
paths = [
    '''tests/tests/''',
    '''\.env\.example$''',
    '''README\.md$''',
]
